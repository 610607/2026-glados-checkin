name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 09:30（UTC 01:30）。一天一次即可，脚本会在失败时自动重试。
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # Must match the browser that created the current gld:sess.
          # Prefer the repository Variable; accept a same-named Secret for compatibility.
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          # Optional per-account overrides (account 1..8). Empty values fall back to GLADOS_USER_AGENT.
          GLADOS_USER_AGENT_1: ${{ vars.GLADOS_USER_AGENT_1 || secrets.GLADOS_USER_AGENT_1 }}
          GLADOS_USER_AGENT_2: ${{ vars.GLADOS_USER_AGENT_2 || secrets.GLADOS_USER_AGENT_2 }}
          GLADOS_USER_AGENT_3: ${{ vars.GLADOS_USER_AGENT_3 || secrets.GLADOS_USER_AGENT_3 }}
          GLADOS_USER_AGENT_4: ${{ vars.GLADOS_USER_AGENT_4 || secrets.GLADOS_USER_AGENT_4 }}
          GLADOS_USER_AGENT_5: ${{ vars.GLADOS_USER_AGENT_5 || secrets.GLADOS_USER_AGENT_5 }}
          GLADOS_USER_AGENT_6: ${{ vars.GLADOS_USER_AGENT_6 || secrets.GLADOS_USER_AGENT_6 }}
          GLADOS_USER_AGENT_7: ${{ vars.GLADOS_USER_AGENT_7 || secrets.GLADOS_USER_AGENT_7 }}
          GLADOS_USER_AGENT_8: ${{ vars.GLADOS_USER_AGENT_8 || secrets.GLADOS_USER_AGENT_8 }}
          CHECKIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
